<!DOCTYPE html>
<html>
<head>
    <title>Q1 – E-Commerce Product Manager</title>
</head>
<body>

    <h2>E-Commerce Product Manager</h2>

    <!-- User Input Form -->
    <label>Product ID:</label>
    <input type="number" id="pid"><br><br>

    <label>Product Name:</label>
    <input type="text" id="pname"><br><br>

    <label>Price:</label>
    <input type="number" id="pprice"><br><br>

    <label>Category:</label>
    <input type="text" id="pcategory"><br><br>

    <button onclick="addProduct()">Add Product</button>

    <h3>Message:</h3>
    <p id="message"></p>

    <script src="index.js"></script>
</body>
</html>
