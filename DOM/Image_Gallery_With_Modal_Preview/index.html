<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery with Modal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h2>Image Gallery</h2>

    <div class="gallery">
        <img src="https://picsum.photos/id/101/200/200" class="thumb">
        <img src="https://picsum.photos/id/102/200/200" class="thumb">
        <img src="https://picsum.photos/id/103/200/200" class="thumb">
        <img src="https://picsum.photos/id/104/200/200" class="thumb">
        <img src="https://picsum.photos/id/105/200/200" class="thumb">
        <img src="https://picsum.photos/id/106/200/200" class="thumb">
    </div>

    <!-- MODAL -->
    <div id="modal" class="modal hidden">
        <div class="modal-content" id="modal-content">
            <img id="modal-img" src="">
        </div>
    </div>

    <script src="gallery.js"></script>
</body>
</html>
