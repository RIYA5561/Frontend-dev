<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>
<body>

    <!-- School Name -->
    <h1>Sunshine High School</h1>

    <!-- Student Report Table -->
    <table border="1" cellpadding="10" cellspacing="0">
        <caption>Student Report Card</caption>

        <!-- Table Header -->
        <thead>
            <tr>
                <th rowspan="2" title="Student Name">Student</th>
                <th colspan="5" title="Marks obtained in each subject">Subjects</th>
            </tr>
            <tr>
                <th>Mathematics</th>
                <th>Science</th>
                <th>English</th>
                <th>History</th>
                <th>Computer</th>
            </tr>
        </thead>

        <!-- Table Body -->
        <tbody>
            <tr>
                <td>Riya Agrawal</td>
                <td title="Mathematics marks">95</td>
                <td title="Science marks">88</td>
                <td title="English marks">92</td>
                <td title="History marks">85</td>
                <td title="Computer marks">98</td>
            </tr>
            <tr>
                <td colspan="5" style="text-align:center;">Total: 458 | Percentage: 91.6%</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
